name: Partner PR Release Automation

on:
  workflow_call:
    secrets:
      JIRA_WEBHOOK_URL:
        required: true
        description: "Azure Function App webhook URL for CreateJiraCM"

jobs:
  process-upgrade-pr:
    runs-on: ubuntu-latest
    # Only run when target branch is -staging or -release
    # TODO: Re-enable branch gating after testing.
    # if: endsWith(github.base_ref, '-staging') || endsWith(github.base_ref, '-release')
    
    steps:
      - name: Check for merge conflicts
        id: conflict_check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # Poll GitHub API until mergeable status is determined
          MERGEABLE="null"
          for i in {1..10}; do
            MERGEABLE=$(gh api "/repos/$REPO/pulls/$PR_NUMBER" --jq '.mergeable')
            if [ "$MERGEABLE" != "null" ]; then
              break
            fi
            sleep 3
          done
          
          if [ "$MERGEABLE" = "false" ]; then
            echo "has_conflicts=true" >> $GITHUB_OUTPUT
          else
            echo "has_conflicts=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Stop if merge conflicts
        if: steps.conflict_check.outputs.has_conflicts == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" --body "## ⚠️ Merge Conflicts Detected

          This PR has merge conflicts and will not be merged. Please resolve the conflicts and push the changes; the automation will re-run."
          echo "Merge conflicts detected. PR not merged. Workflow stopped."
          exit 1
      
      - name: Merge PR
        if: steps.conflict_check.outputs.has_conflicts == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr merge "$PR_NUMBER" --merge
          echo "✅ PR merged."
      
      - name: Create CM ticket via runbook
        if: steps.conflict_check.outputs.has_conflicts == 'false'
        env:
          WEBHOOK_URL: ${{ secrets.JIRA_WEBHOOK_URL }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Client name = target branch with -staging / -release suffix stripped (xyz-staging -> xyz).
          # If the branch has neither suffix, the full branch name is used as-is (for testing).
          CLIENT_NAME=$(echo "$BASE_REF" | sed -E 's/-(staging|release)$//')
          RUN_DATE=$(date -u +%Y-%m-%d)
          
          echo "Client: $CLIENT_NAME | Date: $RUN_DATE"
          
          PAYLOAD=$(jq -n \
            --arg clientName "$CLIENT_NAME" \
            --arg date       "$RUN_DATE" \
            '{clientName:$clientName, date:$date}')
          
          curl -s -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
